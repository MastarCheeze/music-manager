services:
  server:
    build: .
    # Do not change these preset environment variables
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      LIBRARY_PATH: /root/StreamripDownloads
      DB_PATH: /root/StreamripDownloads/downloads.db
    env_file: .env
    ports:
      - ${PORT}:8080
    volumes:
      - ${LIBRARY_PATH}:/root/StreamripDownloads
