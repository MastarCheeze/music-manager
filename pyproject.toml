[project]
name = "music-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask>=3.1.3", "python-dotenv>=1.2.4", "streamrip"]

[project.scripts]
music-manager = "music_manager.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
streamrip = { git = "https://github.com/nathom/streamrip.git" }
